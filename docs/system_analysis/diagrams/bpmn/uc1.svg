<path d="M644 692 l12 12 l-12 12 l-12 -12 z" fill="#fff8e1" stroke="#a3660a"/><text x="664" y="706" font-size="11.5" fill="#33475b">шлюз</text>
<circle cx="784" cy="702" r="9" fill="#fdecea" stroke="#b03a2e" stroke-width="3"/><text x="800" y="706" font-size="11.5" fill="#33475b">конец</text>
<line x1="904" y1="702" x2="954" y2="702" stroke="#5f6368" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrm)"/><text x="964" y="706" font-size="11.5" fill="#33475b">межпуловый поток (message flow)</text>

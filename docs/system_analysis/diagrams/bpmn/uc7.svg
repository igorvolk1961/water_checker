<text x="1172" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет → Pre-training на</text>
<text x="1172" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">синтетических данных цифрового</text>
<text x="1172" y="262.0" font-size="10.5" font-style="italic" fill="#8a5a00">двойника; продление периода</text>

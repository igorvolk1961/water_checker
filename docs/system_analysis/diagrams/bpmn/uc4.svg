<rect x="0" y="0" width="3314" height="772" fill="#ffffff"/>
<text x="264" y="42" font-family="Unbounded, Manrope, sans-serif" font-size="24" font-weight="700" fill="#0e2433">BPMN v1 — UC4: Формирование задания на внеплановый (триггерный) отбор пробы</text>
<rect x="24" y="118" width="3266" height="504" rx="14" fill="#f7fbfb" stroke="#dfe8ea"/>
<text transform="translate(46,370.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">AquaPredict</text>
<rect x="24" y="286" width="3266" height="168" rx="14" fill="#fbfaf6" stroke="#dfe8ea"/>
<text transform="translate(46,370.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">«БИТ:LIMS» (1С)</text>
<line x1="70" y1="118" x2="3274" y2="118" stroke="#e3ecee"/>
<text x="86" y="196.0" font-size="14" font-weight="700" fill="#0e2433">Система (AquaPredict)</text>
<text x="86" y="216.0" font-size="11" fill="#5d7285">дорожка</text>
<line x1="70" y1="286" x2="3274" y2="286" stroke="#e3ecee"/>
<text x="86" y="364.0" font-size="14" font-weight="700" fill="#0e2433">1С</text>
<text x="86" y="384.0" font-size="11" fill="#5d7285">дорожка</text>
<line x1="70" y1="454" x2="3274" y2="454" stroke="#e3ecee"/>
<text x="86" y="532.0" font-size="14" font-weight="700" fill="#0e2433">Лаборант</text>
<text x="86" y="552.0" font-size="11" fill="#5d7285">дорожка</text>
<circle cx="382.0" cy="202.0" r="26" fill="#e7f6ec" stroke="#1e8449" stroke-width="3"/>
<text x="382.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">Старт</text>
<text x="508" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<rect x="594" y="142.5" width="236" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="608" y="166.5" font-size="12.5" fill="#16262e">Генерация задания «Внеплановый</text>
<text x="608" y="182.5" font-size="12.5" fill="#16262e">отбор пробы» для конкретной</text>
<text x="608" y="198.5" font-size="12.5" fill="#16262e">партии, приоритет «Срочно»;</text>
<text x="608" y="214.5" font-size="12.5" fill="#16262e">запись в 1С через HTTP-сервис</text>
<text x="608" y="230.5" font-size="12.5" fill="#16262e">(FR-07)</text>
<text x="608" y="251.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="838" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<rect x="924" y="319.0" width="236" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="938" y="343.0" font-size="12.5" fill="#16262e">Задание в модуле отбора;</text>
<text x="938" y="359.0" font-size="12.5" fill="#16262e">уведомление лаборанту штатными</text>
<text x="938" y="375.0" font-size="12.5" fill="#16262e">средствами 1С (канал —</text>
<text x="938" y="391.0" font-size="12.5" fill="#16262e">открытый вопрос 2)</text>
<text x="938" y="411.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="1168" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<rect x="1254" y="495.5" width="236" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="1268" y="519.5" font-size="12.5" fill="#16262e">Физический отбор пробы у</text>
<text x="1268" y="535.5" font-size="12.5" fill="#16262e">линии: стерильная тара,</text>
<text x="1268" y="551.5" font-size="12.5" fill="#16262e">маркировка (вне систем)</text>
<text x="1268" y="570.5" font-size="10.5" fill="#7a8b99">(задача (HITL))</text>
<text x="1498" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1584" y="478.5" width="236" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="1598" y="502.5" font-size="12.5" fill="#16262e">Сканирование штрихкода пробы в</text>
<text x="1598" y="518.5" font-size="12.5" fill="#16262e">1С — подтверждение факта</text>
<text x="1598" y="534.5" font-size="12.5" fill="#16262e">отбора; далее — стандартный</text>
<text x="1598" y="550.5" font-size="12.5" fill="#16262e">лабораторный анализ (Chain of</text>
<text x="1598" y="566.5" font-size="12.5" fill="#16262e">Custody ведёт 1С)</text>
<text x="1598" y="587.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="1828" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<rect x="1914" y="159.5" width="236" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="1928" y="183.5" font-size="12.5" fill="#16262e">Чтение статуса задания и пробы</text>
<text x="1928" y="199.5" font-size="12.5" fill="#16262e">по OData; сохранение ссылки</text>
<text x="1928" y="215.5" font-size="12.5" fill="#16262e">«инцидент → задание → проба»</text>
<text x="1928" y="234.5" font-size="10.5" fill="#7a8b99">(задача (FR-07, FR-08))</text>
<text x="2158" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>
<rect x="2244" y="142.5" width="236" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="2258" y="166.5" font-size="12.5" fill="#16262e">Автоматическая связка «проба →</text>
<text x="2258" y="182.5" font-size="12.5" fill="#16262e">срез телеметрии за окно (2 ч)»</text>
<text x="2258" y="198.5" font-size="12.5" fill="#16262e">— Feature Vector +</text>
<text x="2258" y="214.5" font-size="12.5" fill="#16262e">лабораторный результат как</text>
<text x="2258" y="230.5" font-size="12.5" fill="#16262e">метка</text>
<text x="2258" y="251.5" font-size="10.5" fill="#7a8b99">(задача (FR-08, UC6))</text>
<text x="2488" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<rect x="2574" y="333.0" width="236" height="74" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="2588" y="357.0" font-size="12.5" fill="#16262e">Лабораторный анализ, протокол</text>
<text x="2588" y="373.0" font-size="12.5" fill="#16262e">испытаний (ground truth)</text>
<text x="2588" y="397.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="2818" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">8</text>
<circle cx="3022.0" cy="202.0" r="26" fill="#fdecea" stroke="#b03a2e" stroke-width="6"/>
<text x="3022.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a2e">Конец</text>
<text x="3148" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">9</text>

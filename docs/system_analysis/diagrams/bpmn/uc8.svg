<text transform="translate(46,286.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">AquaPredict</text>
<line x1="70" y1="118" x2="2284" y2="118" stroke="#e3ecee"/>
<text x="86" y="196.0" font-size="14" font-weight="700" fill="#0e2433">Система (AquaPredict)</text>
<text x="86" y="216.0" font-size="11" fill="#5d7285">дорожка</text>
<line x1="70" y1="286" x2="2284" y2="286" stroke="#e3ecee"/>
<text x="86" y="364.0" font-size="14" font-weight="700" fill="#0e2433">КИПиА</text>
<text x="86" y="384.0" font-size="11" fill="#5d7285">дорожка</text>
<rect x="264" y="117.0" width="236" height="170" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="278" y="141.0" font-size="12.5" fill="#16262e">Непрерывная проверка</text>
<text x="278" y="157.0" font-size="12.5" fill="#16262e">доступности датчиков (OPC-UA)</text>
<text x="278" y="173.0" font-size="12.5" fill="#16262e">и целостности потока: пропуски</text>
<text x="278" y="189.0" font-size="12.5" fill="#16262e">отметок, «замороженные»</text>
<text x="278" y="205.0" font-size="12.5" fill="#16262e">значения, рассинхронизация</text>
<text x="278" y="221.0" font-size="12.5" fill="#16262e">времени, выход за физические</text>
<text x="278" y="237.0" font-size="12.5" fill="#16262e">границы значений (FR-16.1,</text>
<text x="278" y="253.0" font-size="12.5" fill="#16262e">FR-02.4)</text>
<text x="278" y="277.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="508" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<path d="M712.0 142.0 L772.0 202.0 L712.0 262.0 L652.0 202.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2"/>
<text x="712.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Аномалия обнаружена?</text>
<text x="838" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<text x="842" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет → продолжение мониторинга;</text>
<text x="842" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">статусы датчиков и буфера — на</text>
<text x="842" y="262.0" font-size="10.5" font-style="italic" fill="#8a5a00">SCR-09</text>
<rect x="924" y="151.0" width="236" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="938" y="175.0" font-size="12.5" fill="#16262e">Диагностическое уведомление</text>
<text x="938" y="191.0" font-size="12.5" fill="#16262e">инженеру КИПиА (канал —</text>
<text x="938" y="207.0" font-size="12.5" fill="#16262e">SCR-12); пометка достоверности</text>
<text x="938" y="223.0" font-size="12.5" fill="#16262e">канала</text>
<text x="938" y="243.0" font-size="10.5" fill="#7a8b99">(задача (FR-16.3))</text>
<text x="1168" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<rect x="1254" y="142.5" width="236" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="1268" y="166.5" font-size="12.5" fill="#16262e">Скоринг по данным</text>
<text x="1268" y="182.5" font-size="12.5" fill="#16262e">деградировавшего канала</text>
<text x="1268" y="198.5" font-size="12.5" fill="#16262e">помечается признаком</text>
<text x="1268" y="214.5" font-size="12.5" fill="#16262e">пониженной достоверности</text>
<text x="1268" y="230.5" font-size="12.5" fill="#16262e">(SCR-01/SCR-02)</text>
<text x="1268" y="251.5" font-size="10.5" fill="#7a8b99">(задача (FR-16.4))</text>
<text x="1498" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1584" y="327.5" width="236" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="1598" y="351.5" font-size="12.5" fill="#16262e">Устранение неисправности (вне</text>
<text x="1598" y="367.5" font-size="12.5" fill="#16262e">системы) и подтверждение</text>
<text x="1598" y="383.5" font-size="12.5" fill="#16262e">восстановления</text>
<text x="1598" y="402.5" font-size="10.5" fill="#7a8b99">(задача (HITL))</text>
<text x="1828" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>

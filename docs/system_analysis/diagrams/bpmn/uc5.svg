<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1834 604" width="1834" height="604" font-family="Manrope, Segoe UI, system-ui, sans-serif">
<defs>
<marker id="arr" markerWidth="12" markerHeight="12" refX="10" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#33475b"/></marker>

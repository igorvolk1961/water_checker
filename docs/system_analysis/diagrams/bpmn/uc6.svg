<text x="1042.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">или противоречат</text>
<text x="1042.0" y="224.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">объективным данным?</text>
<text x="1168" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<text x="1172" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Да → карантин «Конфликт разметки»,</text>
<text x="1172" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">пример не используется в обучении</text>
<text x="1172" y="262.0" font-size="10.5" font-style="italic" fill="#8a5a00">до разрешения</text>

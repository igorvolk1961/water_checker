<path d="M634 692 l12 12 l-12 12 l-12 -12 z" fill="#fff8e1" stroke="#a3660a"/><text x="654" y="706" font-size="11.5" fill="#33475b">шлюз</text>
<circle cx="774" cy="702" r="9" fill="#fdecea" stroke="#b03a2e" stroke-width="3"/><text x="790" y="706" font-size="11.5" fill="#33475b">конец</text>
<line x1="894" y1="702" x2="944" y2="702" stroke="#5f6368" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrm)"/><text x="954" y="706" font-size="11.5" fill="#33475b">межпуловый поток (message flow)</text>

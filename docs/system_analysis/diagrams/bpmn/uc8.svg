<text x="268" y="141.0" font-size="12.5" fill="#16262e">Непрерывная проверка</text>
<text x="268" y="157.0" font-size="12.5" fill="#16262e">доступности датчиков (OPC-UA)</text>
<text x="268" y="173.0" font-size="12.5" fill="#16262e">и целостности потока: пропуски</text>
<text x="268" y="189.0" font-size="12.5" fill="#16262e">отметок, «замороженные»</text>
<text x="268" y="205.0" font-size="12.5" fill="#16262e">значения, рассинхронизация</text>
<text x="268" y="221.0" font-size="12.5" fill="#16262e">времени, выход за физические</text>
<text x="268" y="237.0" font-size="12.5" fill="#16262e">границы значений (FR-16.1,</text>
<text x="268" y="253.0" font-size="12.5" fill="#16262e">FR-02.4)</text>
<text x="268" y="277.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="484" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<path d="M665.0 142.0 L725.0 202.0 L665.0 262.0 L605.0 202.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2" filter="url(#sh)"/>
<text x="665.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Аномалия обнаружена?</text>
<text x="784" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<text x="788" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет → продолжение мониторинга;</text>
<text x="788" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">статусы датчиков и буфера — на</text>
<text x="788" y="262.0" font-size="10.5" font-style="italic" fill="#8a5a00">SCR-09</text>
<rect x="854" y="151.0" width="222" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="868" y="175.0" font-size="12.5" fill="#16262e">Диагностическое уведомление</text>
<text x="868" y="191.0" font-size="12.5" fill="#16262e">инженеру КИПиА (канал —</text>
<text x="868" y="207.0" font-size="12.5" fill="#16262e">SCR-12); пометка достоверности</text>
<text x="868" y="223.0" font-size="12.5" fill="#16262e">канала</text>
<text x="868" y="243.0" font-size="10.5" fill="#7a8b99">(задача (FR-16.3))</text>
<text x="1084" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<rect x="1154" y="142.5" width="222" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1168" y="166.5" font-size="12.5" fill="#16262e">Скоринг по данным</text>
<text x="1168" y="182.5" font-size="12.5" fill="#16262e">деградировавшего канала</text>
<text x="1168" y="198.5" font-size="12.5" fill="#16262e">помечается признаком</text>
<text x="1168" y="214.5" font-size="12.5" fill="#16262e">пониженной достоверности</text>
<text x="1168" y="230.5" font-size="12.5" fill="#16262e">(SCR-01/SCR-02)</text>
<text x="1168" y="251.5" font-size="10.5" fill="#7a8b99">(задача (FR-16.4))</text>
<text x="1384" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1454" y="327.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1468" y="351.5" font-size="12.5" fill="#16262e">Устранение неисправности (вне</text>
<text x="1468" y="367.5" font-size="12.5" fill="#16262e">системы) и подтверждение</text>
<text x="1468" y="383.5" font-size="12.5" fill="#16262e">восстановления</text>
<text x="1468" y="402.5" font-size="10.5" fill="#7a8b99">(задача (HITL))</text>
<text x="1684" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<circle cx="1865.0" cy="202.0" r="26" fill="#fdecea" stroke="#b03a2e" stroke-width="6"/>
<text x="1865.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a2e">Конец</text>
<text x="1984" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>

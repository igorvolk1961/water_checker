<path d="M1490 370.0 H1537.0 V370.0 H1584" fill="none" stroke="#33475b" stroke-width="2" marker-end="url(#arr)"/>
<text x="264" y="538" font-size="12" font-weight="700" fill="#5d7285">Легенда:</text>
<circle cx="354" cy="534" r="9" fill="#e7f6ec" stroke="#1e8449" stroke-width="2"/><text x="370" y="538" font-size="11.5" fill="#33475b">событие старта</text>
<rect x="494" y="525" width="34" height="20" rx="5" fill="#ffffff" stroke="#0e7c86" stroke-width="1.6"/><text x="536" y="538" font-size="11.5" fill="#33475b">задача</text>
<path d="M644 524 l12 12 l-12 12 l-12 -12 z" fill="#fff8e1" stroke="#a3660a"/><text x="664" y="538" font-size="11.5" fill="#33475b">шлюз</text>
<circle cx="784" cy="534" r="9" fill="#fdecea" stroke="#b03a2e" stroke-width="3"/><text x="800" y="538" font-size="11.5" fill="#33475b">конец</text>
<line x1="904" y1="534" x2="954" y2="534" stroke="#5f6368" stroke-width="2" stroke-dasharray="6 4" marker-end="url(#arrm)"/><text x="964" y="538" font-size="11.5" fill="#33475b">межпуловый поток (message flow)</text>
</svg>
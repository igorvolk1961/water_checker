<text x="2362.0" y="224.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">(допустимый</text>
<text x="2488" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<text x="2492" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет (Data Drift, поток 6а) →</text>
<text x="2492" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">отмена развёртывания; датасет —</text>

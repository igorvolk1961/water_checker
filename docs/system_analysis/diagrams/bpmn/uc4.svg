</defs>
<rect x="0" y="0" width="3034" height="772" fill="#ffffff"/>
<text x="254" y="42" font-family="Unbounded, Manrope, sans-serif" font-size="24" font-weight="700" fill="#0e2433">BPMN v1 — UC4: Формирование задания на внеплановый (триггерный) отбор пробы</text>

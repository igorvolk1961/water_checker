[project]
name = "aquapredict"
version = "0.1.0"
description = "AquaPredict — предиктивная аналитика качества бутилированной воды (IoT/ML), надстройка над «БИТ.Лаборатория»"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary" }
authors = [{ name = "AquaPredict team" }]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "httpx>=0.27",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.2",
    "redis>=5.0",
    "asyncua>=1.1",
    "paho-mqtt>=2.1",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "numpy>=2.0",
]

[project.optional-dependencies]
mlops = ["mlflow>=2.15"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-asyncio>=0.24",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv]
# Приложение, а не библиотека: пакет не устанавливается (src-layout, импорт через PYTHONPATH/pythonpath).
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["aquapredict"]
warn_unused_ignores = true

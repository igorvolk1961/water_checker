<rect x="2244" y="159.5" width="236" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="2258" y="183.5" font-size="12.5" fill="#16262e">Shadow Mode: прогнозы не</text>
<text x="2258" y="199.5" font-size="12.5" fill="#16262e">показываются персоналу,</text>
<text x="2258" y="215.5" font-size="12.5" fill="#16262e">накапливаются метрики точности</text>
<text x="2258" y="234.5" font-size="10.5" fill="#7a8b99">(задача (FR-04))</text>
<text x="2488" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<rect x="2574" y="501.0" width="236" height="74" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="2588" y="525.0" font-size="12.5" fill="#16262e">Подтверждение профиля нормы</text>
<text x="2588" y="541.0" font-size="12.5" fill="#16262e">как «Эталонный» (ST-06)</text>
<text x="2588" y="565.0" font-size="10.5" fill="#7a8b99">(задача (UI-07: фиксация в аудите))</text>

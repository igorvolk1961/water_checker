<text x="365.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">Старт</text>
<text x="484" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<rect x="554" y="663.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="568" y="687.5" font-size="12.5" fill="#16262e">Задача назначена исполнителю;</text>
<text x="568" y="703.5" font-size="12.5" fill="#16262e">уведомление штатными</text>
<text x="568" y="719.5" font-size="12.5" fill="#16262e">средствами 1С</text>
<text x="568" y="738.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="784" y="666.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<rect x="854" y="333.0" width="222" height="74" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="868" y="357.0" font-size="12.5" fill="#16262e">Физическое выполнение действия</text>
<text x="868" y="373.0" font-size="12.5" fill="#16262e">на оборудовании (вне систем)</text>
<text x="868" y="397.0" font-size="10.5" fill="#7a8b99">(задача (HITL, LGL-04))</text>
<text x="1084" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<rect x="1154" y="327.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1168" y="351.5" font-size="12.5" fill="#16262e">Закрытие задачи в 1С:</text>
<text x="1168" y="367.5" font-size="12.5" fill="#16262e">«Действие выполнено» +</text>
<text x="1168" y="383.5" font-size="12.5" fill="#16262e">приложение (фото/комментарий)</text>
<text x="1168" y="402.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="1384" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1454" y="663.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1468" y="687.5" font-size="12.5" fill="#16262e">Статус задачи [Выполнено /</text>
<text x="1468" y="703.5" font-size="12.5" fill="#16262e">Отменено]; время и исполнитель</text>
<text x="1468" y="719.5" font-size="12.5" fill="#16262e">фиксируются в 1С</text>
<text x="1468" y="738.5" font-size="10.5" fill="#7a8b99">(задача (LGL-10))</text>
<text x="1684" y="666.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<rect x="1754" y="151.0" width="222" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1768" y="175.0" font-size="12.5" fill="#16262e">Чтение статуса по OData;</text>
<text x="1768" y="191.0" font-size="12.5" fill="#16262e">синхронизация в карточку</text>
<text x="1768" y="207.0" font-size="12.5" fill="#16262e">инцидента (SCR-02); различение</text>
<text x="1768" y="223.0" font-size="12.5" fill="#16262e">источника события в аудите</text>
<text x="1768" y="243.0" font-size="10.5" fill="#7a8b99">(задача (LGL-10, FR-14))</text>
<text x="1984" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>
<path d="M2165.0 142.0 L2225.0 202.0 L2165.0 262.0 L2105.0 202.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2" filter="url(#sh)"/>
<text x="2165.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Результат</text>
<text x="2165.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">корректирующего</text>
<text x="2165.0" y="224.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">действия</text>
<text x="2284" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<text x="2288" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Отменено → инцидент возвращается в</text>
<text x="2288" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">статус [Новый] (переход доменной</text>
<text x="2288" y="262.0" font-size="10.5" font-style="italic" fill="#8a5a00">модели, решение В-2): пересмотр ГТ</text>
<text x="2288" y="275.0" font-size="10.5" font-style="italic" fill="#8a5a00">— новая рекомендация или вердикт</text>
<rect x="2354" y="461.5" width="222" height="153" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2368" y="485.5" font-size="12.5" fill="#16262e">Фиксация **вердикта по</text>
<text x="2368" y="501.5" font-size="12.5" fill="#16262e">инциденту** — отдельная</text>
<text x="2368" y="517.5" font-size="12.5" fill="#16262e">сущность: [Подтверждён /</text>
<text x="2368" y="533.5" font-size="12.5" fill="#16262e">Ложное срабатывание] + причина</text>
<text x="2368" y="549.5" font-size="12.5" fill="#16262e">(не смешивать с результатом</text>
<text x="2368" y="565.5" font-size="12.5" fill="#16262e">корректирующего действия —</text>
<text x="2368" y="581.5" font-size="12.5" fill="#16262e">устранение дефекта US-05.1)</text>
<text x="2368" y="604.5" font-size="10.5" fill="#7a8b99">(задача (FR-06, FR-12))</text>
<text x="2584" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">8</text>
<rect x="2654" y="134.0" width="222" height="136" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2668" y="158.0" font-size="12.5" fill="#16262e">Вердикт → прокси-метка в</text>
<text x="2668" y="174.0" font-size="12.5" fill="#16262e">обучающую выборку (FR-11;</text>
<text x="2668" y="190.0" font-size="12.5" fill="#16262e">приоритет — лабораторный</text>
<text x="2668" y="206.0" font-size="12.5" fill="#16262e">протокол); инцидент [Закрыт];</text>
<text x="2668" y="222.0" font-size="12.5" fill="#16262e">блокировка закрытия партии</text>
<text x="2668" y="238.0" font-size="12.5" fill="#16262e">снята (FR-01)</text>
<text x="2668" y="260.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="2884" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">9</text>

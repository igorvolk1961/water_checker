<text x="1268" y="214.5" font-size="12.5" fill="#16262e">качестве матчинга (доля ≥ 90 %</text>
<text x="1268" y="230.5" font-size="12.5" fill="#16262e">— `kpi.md` §4)</text>
<text x="1268" y="251.5" font-size="10.5" fill="#7a8b99">(задача (FR-10))</text>

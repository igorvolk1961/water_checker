<text transform="translate(46,538.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">«БИТ:LIMS» (1С)</text>
<rect x="70" y="118" width="2924" height="168" fill="#eef6f7" opacity="0.55"/>
<line x1="70" y1="118" x2="2994" y2="118" stroke="#e3ecee"/>
<text x="86" y="196.0" font-size="14" font-weight="700" fill="#0e2433">Система (AquaPredict)</text>
<text x="86" y="216.0" font-size="11" fill="#5d7285">дорожка</text>
<line x1="70" y1="286" x2="2994" y2="286" stroke="#e3ecee"/>
<text x="86" y="364.0" font-size="14" font-weight="700" fill="#0e2433">Лаборант</text>
<text x="86" y="384.0" font-size="11" fill="#5d7285">дорожка</text>
<rect x="70" y="454" width="2924" height="168" fill="#eef6f7" opacity="0.55"/>
<line x1="70" y1="454" x2="2994" y2="454" stroke="#e3ecee"/>
<text x="86" y="532.0" font-size="14" font-weight="700" fill="#0e2433">1С</text>
<text x="86" y="552.0" font-size="11" fill="#5d7285">дорожка</text>
<circle cx="365.0" cy="202.0" r="26" fill="#e7f6ec" stroke="#1e8449" stroke-width="3"/>
<text x="365.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">Старт</text>
<text x="484" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<rect x="554" y="142.5" width="222" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="568" y="166.5" font-size="12.5" fill="#16262e">Генерация задания «Внеплановый</text>
<text x="568" y="182.5" font-size="12.5" fill="#16262e">отбор пробы» для конкретной</text>
<text x="568" y="198.5" font-size="12.5" fill="#16262e">партии, приоритет «Срочно»;</text>
<text x="568" y="214.5" font-size="12.5" fill="#16262e">запись в 1С через HTTP-сервис</text>
<text x="568" y="230.5" font-size="12.5" fill="#16262e">(FR-07)</text>
<text x="568" y="251.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="784" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<rect x="854" y="487.0" width="222" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="868" y="511.0" font-size="12.5" fill="#16262e">Задание в модуле отбора;</text>
<text x="868" y="527.0" font-size="12.5" fill="#16262e">уведомление лаборанту штатными</text>
<text x="868" y="543.0" font-size="12.5" fill="#16262e">средствами 1С (канал —</text>
<text x="868" y="559.0" font-size="12.5" fill="#16262e">открытый вопрос 2)</text>
<text x="868" y="579.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="1084" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<rect x="1154" y="327.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1168" y="351.5" font-size="12.5" fill="#16262e">Физический отбор пробы у</text>
<text x="1168" y="367.5" font-size="12.5" fill="#16262e">линии: стерильная тара,</text>
<text x="1168" y="383.5" font-size="12.5" fill="#16262e">маркировка (вне систем)</text>
<text x="1168" y="402.5" font-size="10.5" fill="#7a8b99">(задача (HITL))</text>
<text x="1384" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1454" y="310.5" width="222" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1468" y="334.5" font-size="12.5" fill="#16262e">Сканирование штрихкода пробы в</text>
<text x="1468" y="350.5" font-size="12.5" fill="#16262e">1С — подтверждение факта</text>
<text x="1468" y="366.5" font-size="12.5" fill="#16262e">отбора; далее — стандартный</text>
<text x="1468" y="382.5" font-size="12.5" fill="#16262e">лабораторный анализ (Chain of</text>
<text x="1468" y="398.5" font-size="12.5" fill="#16262e">Custody ведёт 1С)</text>
<text x="1468" y="419.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="1684" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<rect x="1754" y="159.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1768" y="183.5" font-size="12.5" fill="#16262e">Чтение статуса задания и пробы</text>
<text x="1768" y="199.5" font-size="12.5" fill="#16262e">по OData; сохранение ссылки</text>
<text x="1768" y="215.5" font-size="12.5" fill="#16262e">«инцидент → задание → проба»</text>
<text x="1768" y="234.5" font-size="10.5" fill="#7a8b99">(задача (FR-07, FR-08))</text>
<text x="1984" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>
<rect x="2054" y="142.5" width="222" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2068" y="166.5" font-size="12.5" fill="#16262e">Автоматическая связка «проба →</text>
<text x="2068" y="182.5" font-size="12.5" fill="#16262e">срез телеметрии за окно (2 ч)»</text>
<text x="2068" y="198.5" font-size="12.5" fill="#16262e">— Feature Vector +</text>
<text x="2068" y="214.5" font-size="12.5" fill="#16262e">лабораторный результат как</text>
<text x="2068" y="230.5" font-size="12.5" fill="#16262e">метка</text>
<text x="2068" y="251.5" font-size="10.5" fill="#7a8b99">(задача (FR-08, UC6))</text>
<text x="2284" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<rect x="2354" y="501.0" width="222" height="74" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2368" y="525.0" font-size="12.5" fill="#16262e">Лабораторный анализ, протокол</text>
<text x="2368" y="541.0" font-size="12.5" fill="#16262e">испытаний (ground truth)</text>
<text x="2368" y="565.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="2584" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">8</text>
<circle cx="2765.0" cy="202.0" r="26" fill="#fdecea" stroke="#b03a2e" stroke-width="6"/>
<text x="2765.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a2e">Конец</text>
<text x="2884" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">9</text>

</defs>
<rect x="0" y="0" width="2734" height="772" fill="#ffffff"/>
<text x="254" y="42" font-family="Unbounded, Manrope, sans-serif" font-size="24" font-weight="700" fill="#0e2433">BPMN v1 — UC1: Синхронизация производственной партии и привязка к потоку данных датчиков</text>
<text x="254" y="70" font-size="13" fill="#5d7285">Версия:</text>
<rect x="24" y="118" width="2686" height="168" rx="14" fill="#fbfaf6" stroke="#dfe8ea"/>
<text transform="translate(46,202.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">«БИТ:LIMS» (1С)</text>
<rect x="24" y="286" width="2686" height="168" rx="14" fill="#f7fbfb" stroke="#dfe8ea"/>
<text transform="translate(46,370.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">AquaPredict</text>
<rect x="24" y="454" width="2686" height="168" rx="14" fill="#f6f9fb" stroke="#dfe8ea"/>
<text transform="translate(46,538.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">Линия/шлюз (внешнее)</text>
<rect x="70" y="118" width="2624" height="168" fill="#eef6f7" opacity="0.55"/>
<line x1="70" y1="118" x2="2694" y2="118" stroke="#e3ecee"/>
<text x="86" y="196.0" font-size="14" font-weight="700" fill="#0e2433">1С</text>
<text x="86" y="216.0" font-size="11" fill="#5d7285">дорожка</text>
<line x1="70" y1="286" x2="2694" y2="286" stroke="#e3ecee"/>
<text x="86" y="364.0" font-size="14" font-weight="700" fill="#0e2433">Система (AquaPredict)</text>
<text x="86" y="384.0" font-size="11" fill="#5d7285">дорожка</text>
<rect x="70" y="454" width="2624" height="168" fill="#eef6f7" opacity="0.55"/>
<line x1="70" y1="454" x2="2694" y2="454" stroke="#e3ecee"/>
<text x="86" y="532.0" font-size="14" font-weight="700" fill="#0e2433">Линия / IoT-шлюз</text>
<text x="86" y="552.0" font-size="11" fill="#5d7285">дорожка</text>
<circle cx="365.0" cy="202.0" r="26" fill="#e7f6ec" stroke="#1e8449" stroke-width="3"/>
<text x="365.0" y="250.0" text-anchor="middle" font-size="13" font-weight="700" fill="#1e8449">Старт</text>
<text x="484" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<rect x="554" y="327.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="568" y="351.5" font-size="12.5" fill="#16262e">Чтение новой партии по OData</text>
<text x="568" y="367.5" font-size="12.5" fill="#16262e">(в составе пакета, ≤ 60</text>
<text x="568" y="383.5" font-size="12.5" fill="#16262e">запросов/мин — NFR-6)</text>
<text x="568" y="402.5" font-size="10.5" fill="#7a8b99">(задача (FR-15))</text>
<text x="784" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<rect x="854" y="319.0" width="222" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="868" y="343.0" font-size="12.5" fill="#16262e">Регистрация начала наблюдения</text>
<text x="868" y="359.0" font-size="12.5" fill="#16262e">за партией; привязка временных</text>
<text x="868" y="375.0" font-size="12.5" fill="#16262e">рядов телеметрии к</text>
<text x="868" y="391.0" font-size="12.5" fill="#16262e">идентификатору партии</text>
<text x="868" y="411.0" font-size="10.5" fill="#7a8b99">(задача (FR-01))</text>
<text x="1084" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<rect x="1154" y="478.5" width="222" height="119" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1168" y="502.5" font-size="12.5" fill="#16262e">Поток телеметрии TEL-01…TEL-13</text>
<text x="1168" y="518.5" font-size="12.5" fill="#16262e">по OPC-UA / MQTT, частота ≥ 1</text>
<text x="1168" y="534.5" font-size="12.5" fill="#16262e">раз/мин; буферизация до 2 ч</text>
<text x="1168" y="550.5" font-size="12.5" fill="#16262e">при потере связи с</text>
<text x="1168" y="566.5" font-size="12.5" fill="#16262e">автосинхронизацией</text>
<text x="1168" y="587.5" font-size="10.5" fill="#7a8b99">(задача (FR-02, NFR-2/3))</text>
<text x="1384" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1454" y="302.0" width="222" height="136" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1468" y="326.0" font-size="12.5" fill="#16262e">Контроль качества потока:</text>
<text x="1468" y="342.0" font-size="12.5" fill="#16262e">пропуски, «замороженные»</text>
<text x="1468" y="358.0" font-size="12.5" fill="#16262e">значения, выход за физический</text>
<text x="1468" y="374.0" font-size="12.5" fill="#16262e">диапазон → события для</text>
<text x="1468" y="390.0" font-size="12.5" fill="#16262e">инженера КИПиА (SCR-09);</text>
<text x="1468" y="406.0" font-size="12.5" fill="#16262e">пометка достоверности канала</text>
<text x="1468" y="428.0" font-size="10.5" fill="#7a8b99">(задача (FR-16))</text>
<text x="1684" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<circle cx="1865.0" cy="370.0" r="26" fill="#fdecea" stroke="#b03a2e" stroke-width="6"/>
<text x="1865.0" y="418.0" text-anchor="middle" font-size="13" font-weight="700" fill="#b03a2e">Конец</text>
<text x="1984" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>
<rect x="2054" y="165.0" width="222" height="74" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2068" y="189.0" font-size="12.5" fill="#16262e">Попытка закрытия партии</text>
<text x="2284" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<path d="M2465.0 310.0 L2525.0 370.0 L2465.0 430.0 L2405.0 370.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2" filter="url(#sh)"/>
<text x="2465.0" y="362.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Есть непроверенные</text>
<text x="2465.0" y="377.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">предиктивные</text>
<text x="2465.0" y="392.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">инциденты по партии?</text>
<text x="2584" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">8</text>
<text x="2588" y="404.0" font-size="10.5" font-style="italic" fill="#8a5a00">Да → задача/комментарий в 1С</text>
<text x="2588" y="417.0" font-size="10.5" font-style="italic" fill="#8a5a00">«закрытие блокировано до проверки</text>
<text x="2588" y="430.0" font-size="10.5" font-style="italic" fill="#8a5a00">инцидентов» → проверка инцидентов</text>
<text x="2588" y="443.0" font-size="10.5" font-style="italic" fill="#8a5a00">(UC3) → возврат к шлюзу</text>
<text x="2588" y="456.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет → партия закрывается штатно в</text>
<text x="2588" y="469.0" font-size="10.5" font-style="italic" fill="#8a5a00">1С</text>

</defs>
<rect x="0" y="0" width="3634" height="772" fill="#ffffff"/>
<text x="254" y="42" font-family="Unbounded, Manrope, sans-serif" font-size="24" font-weight="700" fill="#0e2433">BPMN v1 — UC2: Получение и обработка предиктивного предупреждения</text>
<rect x="24" y="118" width="3586" height="336" rx="14" fill="#f7fbfb" stroke="#dfe8ea"/>
<text transform="translate(46,286.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">AquaPredict</text>
<rect x="24" y="454" width="3586" height="168" rx="14" fill="#fbfaf6" stroke="#dfe8ea"/>
<text transform="translate(46,538.0) rotate(-90)" text-anchor="middle" font-family="Unbounded, Manrope, sans-serif" font-size="15" font-weight="700" fill="#0e7c86" letter-spacing="1">«БИТ:LIMS» (1С)</text>
<rect x="70" y="118" width="3524" height="168" fill="#eef6f7" opacity="0.55"/>
<line x1="70" y1="118" x2="3594" y2="118" stroke="#e3ecee"/>
<text x="86" y="196.0" font-size="14" font-weight="700" fill="#0e2433">Система (AquaPredict)</text>
<text x="86" y="216.0" font-size="11" fill="#5d7285">дорожка</text>
<line x1="70" y1="286" x2="3594" y2="286" stroke="#e3ecee"/>
<text x="86" y="364.0" font-size="14" font-weight="700" fill="#0e2433">Главный технолог (ГТ)</text>
<text x="86" y="384.0" font-size="11" fill="#5d7285">дорожка</text>
<rect x="70" y="454" width="3524" height="168" fill="#eef6f7" opacity="0.55"/>
<line x1="70" y1="454" x2="3594" y2="454" stroke="#e3ecee"/>
<text x="86" y="532.0" font-size="14" font-weight="700" fill="#0e2433">1С</text>
<text x="86" y="552.0" font-size="11" fill="#5d7285">дорожка</text>
<rect x="254" y="159.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="268" y="183.5" font-size="12.5" fill="#16262e">Телеметрия по партии связана и</text>
<text x="268" y="199.5" font-size="12.5" fill="#16262e">анализируется (FR-01, FR-02;</text>
<text x="268" y="215.5" font-size="12.5" fill="#16262e">TEL-01…TEL-13)</text>
<text x="268" y="234.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="484" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<rect x="554" y="159.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="568" y="183.5" font-size="12.5" fill="#16262e">Расчёт вероятности риска (Слой</text>
<text x="568" y="199.5" font-size="12.5" fill="#16262e">1 правила / Слой 2 ML;</text>
<text x="568" y="215.5" font-size="12.5" fill="#16262e">FR-03/FR-04)</text>
<text x="568" y="234.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="784" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">2</text>
<path d="M965.0 142.0 L1025.0 202.0 L965.0 262.0 L905.0 202.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2" filter="url(#sh)"/>
<text x="965.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Вероятность ≥</text>
<text x="965.0" y="209.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">рабочей точки?</text>
<text x="1084" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">3</text>
<text x="1088" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет → цикл: возврат к шагу 1</text>
<text x="1088" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">(наблюдение продолжается)</text>
<rect x="1154" y="151.0" width="222" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1168" y="175.0" font-size="12.5" fill="#16262e">Генерация события `RiskAlert`</text>
<text x="1168" y="191.0" font-size="12.5" fill="#16262e">(партия, параметр, риск-скор,</text>
<text x="1168" y="207.0" font-size="12.5" fill="#16262e">горизонт, рекомендация) ≤ 5 с</text>
<text x="1168" y="223.0" font-size="12.5" fill="#16262e">от датчика</text>
<text x="1168" y="243.0" font-size="10.5" fill="#7a8b99">(задача (NFR-1))</text>
<text x="1384" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<path d="M1565.0 142.0 L1625.0 202.0 L1565.0 262.0 L1505.0 202.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2" filter="url(#sh)"/>
<text x="1565.0" y="194.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Алертов за час &lt; 10?</text>
<text x="1684" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<text x="1688" y="236.0" font-size="10.5" font-style="italic" fill="#8a5a00">Нет → приоритизация, подавление</text>
<text x="1688" y="249.0" font-size="10.5" font-style="italic" fill="#8a5a00">дублей → возврат к шагу 4 по</text>
<text x="1688" y="262.0" font-size="10.5" font-style="italic" fill="#8a5a00">изменению ситуации</text>
<rect x="1754" y="134.0" width="222" height="136" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="1768" y="158.0" font-size="12.5" fill="#16262e">Создание записи «Предиктивный</text>
<text x="1768" y="174.0" font-size="12.5" fill="#16262e">инцидент» [Новый]; уведомление</text>
<text x="1768" y="190.0" font-size="12.5" fill="#16262e">ГТ (push/SMS — SCR-12);</text>
<text x="1768" y="206.0" font-size="12.5" fill="#16262e">критический уровень →</text>
<text x="1768" y="222.0" font-size="12.5" fill="#16262e">выделение, звук, подтверждение</text>
<text x="1768" y="238.0" font-size="12.5" fill="#16262e">ознакомления</text>
<text x="1768" y="260.0" font-size="10.5" fill="#7a8b99">(задача (NFR-4))</text>
<text x="1984" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>
<rect x="2054" y="319.0" width="222" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2068" y="343.0" font-size="12.5" fill="#16262e">Получение алерта,</text>
<text x="2068" y="359.0" font-size="12.5" fill="#16262e">подтверждение ознакомления;</text>
<text x="2068" y="375.0" font-size="12.5" fill="#16262e">просмотр карточки инцидента</text>
<text x="2068" y="391.0" font-size="12.5" fill="#16262e">(SCR-02): тренды, рекомендация</text>
<text x="2068" y="411.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="2284" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">7</text>
<path d="M2465.0 310.0 L2525.0 370.0 L2465.0 430.0 L2405.0 370.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2" filter="url(#sh)"/>
<text x="2465.0" y="362.0" text-anchor="middle" font-size="11.5" fill="#6b4b0a">Риск реален?</text>
<text x="2584" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">8</text>
<text x="2588" y="404.0" font-size="10.5" font-style="italic" fill="#8a5a00">Ложное срабатывание → фиксация с</text>
<text x="2588" y="417.0" font-size="10.5" font-style="italic" fill="#8a5a00">причиной из справочника (FR-12) →</text>
<text x="2588" y="430.0" font-size="10.5" font-style="italic" fill="#8a5a00">статус инцидента [Ложный_алерт]</text>
<text x="2588" y="443.0" font-size="10.5" font-style="italic" fill="#8a5a00">(модель ведущего); учтён в</text>
<rect x="2654" y="125.5" width="222" height="153" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2668" y="149.5" font-size="12.5" fill="#16262e">Создание задачи</text>
<text x="2668" y="165.5" font-size="12.5" fill="#16262e">«Корректирующее действие» в 1С</text>
<text x="2668" y="181.5" font-size="12.5" fill="#16262e">через HTTP-сервис с</text>
<text x="2668" y="197.5" font-size="12.5" fill="#16262e">рекомендованными шагами; при</text>
<text x="2668" y="213.5" font-size="12.5" fill="#16262e">высоком риске — параллельно</text>
<text x="2668" y="229.5" font-size="12.5" fill="#16262e">задание внепланового отбора</text>
<text x="2668" y="245.5" font-size="12.5" fill="#16262e">(UC4)</text>
<text x="2668" y="268.5" font-size="10.5" fill="#7a8b99">(задача (FR-06, LGL-10))</text>
<text x="2884" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">9</text>
<rect x="2954" y="495.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="2968" y="519.5" font-size="12.5" fill="#16262e">Задача назначается (ГТ /</text>
<text x="2968" y="535.5" font-size="12.5" fill="#16262e">оператор линии), уведомление</text>
<text x="2968" y="551.5" font-size="12.5" fill="#16262e">штатными средствами 1С</text>
<text x="2968" y="570.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="3184" y="498.0" font-size="12" font-weight="800" fill="#c3d3da">10</text>
<rect x="3254" y="159.5" width="222" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2" filter="url(#sh)"/>
<text x="3268" y="183.5" font-size="12.5" fill="#16262e">Статусы синхронизируются</text>
<text x="3268" y="199.5" font-size="12.5" fill="#16262e">обратно (≤ 60 запросов/мин,</text>
<text x="3268" y="215.5" font-size="12.5" fill="#16262e">NFR-6); инцидент [Подтверждён]</text>
<text x="3268" y="234.5" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="3484" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">11</text>

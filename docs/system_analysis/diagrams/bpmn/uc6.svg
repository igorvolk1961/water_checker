<text x="1498" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">4</text>
<rect x="1584" y="327.5" width="236" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="1598" y="351.5" font-size="12.5" fill="#16262e">Инициирует переобучение</text>
<text x="1598" y="367.5" font-size="12.5" fill="#16262e">(Retraining) на расширенном</text>
<text x="1598" y="383.5" font-size="12.5" fill="#16262e">датасете</text>
<text x="1598" y="402.5" font-size="10.5" fill="#7a8b99">(задача (SCR-07))</text>
<text x="1828" y="330.0" font-size="12" font-weight="800" fill="#c3d3da">5</text>
<rect x="1914" y="151.0" width="236" height="102" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>

<text x="1928" y="207.0" font-size="12.5" fill="#16262e">(Recall/Precision/FPR/F1 —</text>
<text x="1928" y="223.0" font-size="12.5" fill="#16262e">цели по слоям `kpi.md` §2)</text>
<text x="1928" y="243.0" font-size="10.5" fill="#7a8b99">(задача)</text>
<text x="2158" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">6</text>
<path d="M2362.0 142.0 L2422.0 202.0 L2362.0 262.0 L2302.0 202.0 Z" fill="#fff8e1" stroke="#a3660a" stroke-width="2"/>

<text x="278" y="158.0" font-size="12.5" fill="#16262e">Автоагрегация: связка «срез</text>
<text x="278" y="174.0" font-size="12.5" fill="#16262e">телеметрии за окно (2 ч) →</text>
<text x="278" y="190.0" font-size="12.5" fill="#16262e">лабораторный протокол или</text>
<text x="278" y="206.0" font-size="12.5" fill="#16262e">вердикт технолога» →</text>
<text x="278" y="222.0" font-size="12.5" fill="#16262e">«Размеченный пример» (Feature</text>
<text x="278" y="238.0" font-size="12.5" fill="#16262e">Vector + label)</text>
<text x="278" y="260.0" font-size="10.5" fill="#7a8b99">(задача (FR-11))</text>
<text x="508" y="162.0" font-size="12" font-weight="800" fill="#c3d3da">1</text>
<rect x="594" y="159.5" width="236" height="85" rx="10" fill="#ffffff" stroke="#0e7c86" stroke-width="2"/>
<text x="608" y="183.5" font-size="12.5" fill="#16262e">Приоритет метки: лабораторный</text>
